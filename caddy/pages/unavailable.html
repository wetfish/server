<!DOCTYPE html>
<!--
    Shown by Caddy when a project answers 502 or 504, or can't be reached,
    outside a deploy (the maintenance snippet in caddy/Caddyfile). A project
    can show its own page instead with maintenance/unavailable.html in its
    repository. Self-contained: nothing else can be loaded while the site is
    down.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="30">
    <title>Temporarily unavailable</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f6f7f9;
            --text: #1d2330;
            --muted: #5b6475;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #12161d;
                --text: #e6e9ef;
                --muted: #9aa3b2;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }

        main {
            max-width: 32rem;
            text-align: center;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        p {
            margin: 0;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <h1>This site is temporarily unavailable</h1>
        <p>Please try again in a few minutes. This page reloads by itself.</p>
    </main>
</body>
</html>
