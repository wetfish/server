<!--
    Shown by Caddy when a project answers 502 or 504, or can't be reached,
    outside a deploy (the maintenance snippet in caddy/Caddyfile). A project
    can show its own page instead with maintenance/unavailable.html in its
    repository. Self-contained: nothing else can be loaded while the site is
    down, so the Wetfish logo is inline and the colors match wetfish.net.
-->

            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
