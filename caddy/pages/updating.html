<!DOCTYPE html>
<!--
    Shown by Caddy when a project answers 502 or 504 while deploy.sh replaces
    its containers (the maintenance snippet in caddy/Caddyfile). A project can
    show its own page instead with maintenance/updating.html in its
    repository. Self-contained: nothing else can be loaded while the site is
    down.
-->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta http-equiv="refresh" content="15">
    <title>Updating</title>
    <style>
        :root {
            color-scheme: light dark;
            --background: #f6f7f9;
            --text: #1d2330;
            --muted: #5b6475;
            --accent: #1f7a8c;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --background: #12161d;
                --text: #e6e9ef;
                --muted: #9aa3b2;
                --accent: #5cc3d6;
            }
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px 16px;
            background: var(--background);
            color: var(--text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.5;
        }

        main {
            max-width: 32rem;
            text-align: center;
        }

        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 24px;
            border: 4px solid color-mix(in srgb, var(--accent) 25%, transparent);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .spinner {
                animation: none;
            }
        }

        h1 {
            margin: 0 0 8px;
            font-size: 1.5rem;
        }

        p {
            margin: 0;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <main>
        <div class="spinner" aria-hidden="true"></div>
        <h1>We're updating this site</h1>
        <p>It'll be back in a moment. This page reloads by itself.</p>
    </main>
</body>
</html>
